<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Player YT & Spotify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 Web Musik Player</h1>
        <p>Tempel link lagu dari YouTube atau Spotify di bawah ini</p>
        
        <div class="input-group">
            <input type="text" id="linkInput" placeholder="Contoh: https://youtu.be/... atau https://open.spotify.com/track/...">
            <button id="playBtn">Putar</button>
        </div>

        <div id="playerContainer" class="player-container">
            <p class="placeholder-text">Player akan muncul di sini</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
