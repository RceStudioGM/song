<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour Web Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container glass-panel">
        <h1 class="glamor-title">✨ Music Lounge</h1>
        <p class="subtitle">Putar lagu favoritmu dengan gaya</p>
        
        <div class="input-group">
            <input type="text" id="linkInput" placeholder="Tempel link YouTube atau Spotify di sini...">
            <button id="playBtn" class="glow-button">PUTAR</button>
        </div>

        <div id="playerContainer" class="player-container">
            <p class="placeholder-text">Player akan muncul di sini</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
