<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Music Lounge</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative font-sans text-white">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-pink-600/10 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="backdrop-blur-xl bg-black/40 border border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.7)] rounded-3xl p-6 sm:p-10 w-full max-w-2xl relative z-10 transition-all duration-500">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 mb-2 drop-shadow-md">
                ✨ VIP Music Lounge
            </h1>
            <p class="text-gray-300 font-light tracking-wide">Putar lagu dengan gaya elegan.</p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <input type="text" id="linkInput" 
                class="flex-1 bg-black/60 border border-amber-500/50 rounded-xl px-5 py-4 text-white placeholder-gray-400 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30 transition-all duration-300 shadow-inner" 
                placeholder="Tempel link Spotify / YouTube...">
            
            <button id="playBtn" 
                class="bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-extrabold px-8 py-4 rounded-xl hover:scale-105 active:scale-95 transition-all duration-200 shadow-[0_0_15px_rgba(251,191,36,0.4)] hover:shadow-[0_0_25px_rgba(251,191,36,0.8)] flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> PUTAR
            </button>
        </div>

        <div id="playerContainer" class="w-full h-[352px] bg-black/60 rounded-2xl flex items-center justify-center border border-white/5 shadow-inner overflow-hidden transition-all duration-500">
            <div class="text-center text-gray-400 flex flex-col items-center gap-3">
                <i class="fa-solid fa-compact-disc text-5xl opacity-40 animate-[spin_4s_linear_infinite]"></i>
                <p class="italic text-sm">Menunggu alunan musikmu...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
